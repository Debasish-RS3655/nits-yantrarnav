<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Position & Orientation Tracker</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px;
        font-family: monospace;
        border-radius: 5px;
      }
      #controls {
        position: absolute;
        bottom: 20px;
        left: 20px;
        display: flex;
        gap: 10px;
        z-index: 10;
      }
      button {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: 1px solid #666;
        padding: 10px 15px;
        border-radius: 5px;
        font-family: monospace;
        cursor: pointer;
        transition: background 0.3s;
      }
      button:hover {
        background: rgba(30, 30, 80, 0.8);
      }
      .comment-box {
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 4px 6px;
        font-family: monospace;
        font-size: 10px;
        border-radius: 3px;
        border: 1px solid #666;
        white-space: nowrap;
        position: relative;
      }
      .comment-box::before {
        content: "";
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        border: 3px solid transparent;
        border-top-color: rgba(0, 0, 0, 0.8);
      }
      .labelRenderer {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <h3>Position & Orientation Tracker</h3>
      <p>Current Position: <span id="position">x=0 y=0 z=0</span></p>
      <p>Orientation: <span id="orientation">ox=0 oy=0 oz=0 ow=1</span></p>
      <p>Target Position: <span id="target">x=0 y=0 z=0</span></p>
      <p>Connection Status: <span id="status">Connecting...</span></p>
      <p>Current Axes: <span id="axes-info">Z-Up, X-Left</span></p>
    </div>

    <div id="controls">
      <button id="rotate-axes">Rotate Axes</button>
    </div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
    <script>
      // Set up Three.js scene
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111133);

      // Camera
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.x = -100;
      camera.position.y = 100;
      camera.position.z = 100;
      camera.lookAt(0, 0, 0);

      // Renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // CSS2D Renderer
      const labelRenderer = new THREE.CSS2DRenderer();
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.domElement.style.position = "absolute";
      labelRenderer.domElement.style.top = "0";
      labelRenderer.domElement.className = "labelRenderer";
      document.body.appendChild(labelRenderer.domElement);

      // Grid
      let gridHelper = new THREE.GridHelper(100, 10, 0x666666, 0x444444);
      gridHelper.rotation.x = Math.PI / 2;
      scene.add(gridHelper);

      // Axes
      let axesHelper = new THREE.AxesHelper(60);
      axesHelper.scale.x = -1;
      scene.add(axesHelper);

      // Current position dot (red sphere)
      const dotGeometry = new THREE.SphereGeometry(2, 32, 32);
      const dotMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const dot = new THREE.Mesh(dotGeometry, dotMaterial);
      scene.add(dot);

      // Comment box (orientation only)
      const commentDiv = document.createElement("div");
      commentDiv.className = "comment-box";
      commentDiv.innerHTML = "ox=0.000 oy=0.000 oz=0.000 ow=1.000";
      const commentLabel = new THREE.CSS2DObject(commentDiv);
      commentLabel.position.set(0, 5, 0);
      dot.add(commentLabel);

      // Orientation arrow
      const arrowDir = new THREE.Vector3(0, 0, 1);
      const arrowOrigin = new THREE.Vector3(0, 0, 0);
      const arrowLength = 10;
      const arrowColor = 0x00ffff;
      const arrowHelper = new THREE.ArrowHelper(
        arrowDir,
        arrowOrigin,
        arrowLength,
        arrowColor
      );
      scene.add(arrowHelper);

      // Target position dot (green sphere)
      const targetGeometry = new THREE.SphereGeometry(2, 32, 32);
      const targetMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
      const targetDot = new THREE.Mesh(targetGeometry, targetMaterial);
      scene.add(targetDot);

      // Line between current and target
      const lineGeometry = new THREE.BufferGeometry();
      const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffff00 });
      const targetLine = new THREE.Line(lineGeometry, lineMaterial);
      const initialPoints = [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(50, 50, 50),
      ];
      lineGeometry.setFromPoints(initialPoints);
      scene.add(targetLine);

      // Trail
      const trailPoints = [];
      const trailGeometry = new THREE.BufferGeometry();
      const trailMaterial = new THREE.LineBasicMaterial({
        color: 0xff8800,
        opacity: 0.7,
        transparent: true,
      });
      const trail = new THREE.Line(trailGeometry, trailMaterial);
      scene.add(trail);

      // Data
      const position = { x: 0, y: 0, z: 0 };
      const orientation = { x: 0, y: 0, z: 0, w: 1 };
      const target = { x: 50, y: 50, z: 50 };

      // Axis configurations
      let currentAxisConfig = 0;
      const axisConfigs = [
        {
          name: "Z-Up, X-Left",
          transform: (x, y, z) => ({ x: -x, y: y, z: z }),
        },
        {
          name: "Z-Up, X-Right",
          transform: (x, y, z) => ({ x: x, y: y, z: z }),
        },
        {
          name: "Y-Up, X-Left",
          transform: (x, y, z) => ({ x: -x, y: z, z: y }),
        },
        {
          name: "Y-Up, X-Right",
          transform: (x, y, z) => ({ x: x, y: z, z: y }),
        },
        {
          name: "X-Up, Z-Left",
          transform: (x, y, z) => ({ x: -z, y: y, z: x }),
        },
        {
          name: "X-Up, Z-Right",
          transform: (x, y, z) => ({ x: z, y: y, z: x }),
        },
      ];

      // UI elements
      const axesInfoElement = document.getElementById("axes-info");
      const rotateAxesButton = document.getElementById("rotate-axes");
      const statusElement = document.getElementById("status");
      const positionElement = document.getElementById("position");
      const targetElement = document.getElementById("target");
      const orientationElement = document.getElementById("orientation");

      // Rotate axes
      rotateAxesButton.addEventListener("click", (event) => {
        event.stopPropagation();
        console.log("Rotate Axes button clicked");
        rotateAxes();
      });

      function rotateAxes() {
        console.log("rotateAxes called, currentAxisConfig:", currentAxisConfig);
        currentAxisConfig = (currentAxisConfig + 1) % axisConfigs.length;
        const config = axisConfigs[currentAxisConfig];

        axesInfoElement.textContent = config.name;

        trailPoints.length = 0;
        trailGeometry.setFromPoints([]);

        scene.remove(gridHelper);
        scene.remove(axesHelper);

        gridHelper = new THREE.GridHelper(100, 10, 0x666666, 0x444444);
        axesHelper = new THREE.AxesHelper(60);

        if (currentAxisConfig === 0) {
          gridHelper.rotation.x = Math.PI / 2;
          axesHelper.scale.x = -1;
        } else if (currentAxisConfig === 1) {
          gridHelper.rotation.x = Math.PI / 2;
        } else if (currentAxisConfig === 2) {
          axesHelper.scale.x = -1;
        } else if (currentAxisConfig === 3) {
        } else if (currentAxisConfig === 4) {
          gridHelper.rotation.z = Math.PI / 2;
          axesHelper.rotation.z = Math.PI / 2;
          axesHelper.scale.x = -1;
        } else if (currentAxisConfig === 5) {
          gridHelper.rotation.z = Math.PI / 2;
          axesHelper.rotation.z = Math.PI / 2;
        }

        scene.add(gridHelper);
        scene.add(axesHelper);

        if (currentAxisConfig === 0 || currentAxisConfig === 1) {
          camera.position.set(currentAxisConfig === 0 ? 100 : -100, 100, 100);
        } else if (currentAxisConfig === 2 || currentAxisConfig === 3) {
          camera.position.set(currentAxisConfig === 2 ? 100 : -100, 100, -100);
        } else {
          camera.position.set(100, currentAxisConfig === 4 ? 100 : -100, 100);
        }
        camera.lookAt(0, 0, 0);

        updateTargetLine();
      }

      // Window resize
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Camera rotation
      let mouseDown = false;
      let mouseX = 0;
      let mouseY = 0;

      document.addEventListener("mousedown", (e) => {
        if (
          e.target === renderer.domElement ||
          e.target === labelRenderer.domElement
        ) {
          console.log("Mouse down on canvas or labelRenderer");
          mouseDown = true;
          mouseX = e.clientX;
          mouseY = e.clientY;
        }
      });

      document.addEventListener("mouseup", () => {
        console.log("Mouse up");
        mouseDown = false;
      });

      document.addEventListener("mousemove", (e) => {
        if (mouseDown) {
          console.log("Mouse move, updating camera");
          const deltaX = e.clientX - mouseX;
          const deltaY = e.clientY - mouseY;

          const cameraDistance = Math.sqrt(
            camera.position.x * camera.position.x +
              camera.position.y * camera.position.y +
              camera.position.z * camera.position.z
          );

          const theta =
            Math.atan2(camera.position.y, camera.position.x) + deltaX * 0.01;
          const phi =
            Math.acos(camera.position.z / cameraDistance) + deltaY * 0.01;

          const phiClamped = Math.max(0.1, Math.min(Math.PI - 0.1, phi));

          camera.position.x =
            cameraDistance * Math.sin(phiClamped) * Math.cos(theta);
          camera.position.y =
            cameraDistance * Math.sin(phiClamped) * Math.sin(theta);
          camera.position.z = cameraDistance * Math.cos(phiClamped);

          camera.lookAt(0, 0, 0);

          mouseX = e.clientX;
          mouseY = e.clientY;
        }
      });

      // Server URL
      const domainUrl = "http://192.168.31.119:5000";

      // Last position
      let lastPosition = { x: 0, y: 0, z: 0 };
      let hasMovedSignificantly = false;

      // Transform coordinates
      function transformCoordinates(rawX, rawY, rawZ) {
        return axisConfigs[currentAxisConfig].transform(rawX, rawY, rawZ);
      }

      // Transform quaternion
      function transformQuaternion(qx, qy, qz, qw) {
        const quaternion = new THREE.Quaternion(qx, qy, qz, qw).normalize();
        if (currentAxisConfig === 0) {
          return new THREE.Quaternion(-qx, qy, qz, qw).normalize();
        } else if (currentAxisConfig === 1) {
          return quaternion;
        } else if (currentAxisConfig === 2) {
          return new THREE.Quaternion(-qx, qz, qy, qw).normalize();
        } else if (currentAxisConfig === 3) {
          return new THREE.Quaternion(qx, qz, qy, qw).normalize();
        } else if (currentAxisConfig === 4) {
          return new THREE.Quaternion(-qz, qy, qx, qw).normalize();
        } else if (currentAxisConfig === 5) {
          return new THREE.Quaternion(qz, qy, qx, qw).normalize();
        }
        return quaternion;
      }

      // Update target line
      function updateTargetLine() {
        const points = [
          new THREE.Vector3(position.x, position.y, position.z),
          new THREE.Vector3(target.x, target.y, target.z),
        ];
        console.log("Updating target line with points:", points);
        lineGeometry.setFromPoints(points);
        lineGeometry.attributes.position.needsUpdate = true;
      }

      // Fetch current position
      async function fetchCurrentPosition() {
        try {
          //   const response = await fetch(`./coordinates.json`);
          const response = await fetch(`${domainUrl}/coordinates`);
          //   console.log(response);
          if (!response.ok) {
            throw new Error(`HTTP error: ${response.status}`);
          }
          const data = await response.json();
          console.log(data);

          lastPosition = { x: position.x, y: position.y, z: position.z };

          const rawX = data.current.x * 100;
          const rawY = data.current.y * 100;
          const rawZ = -data.current.z * 100;

          const transformed = transformCoordinates(rawX, rawY, rawZ);

          position.x = transformed.x;
          position.y = transformed.y;
          position.z = transformed.z;

          orientation.x = data.orientation ? data.orientation.ox : 0;
          orientation.y = data.orientation ? data.orientation.oy : 0;
          orientation.z = data.orientation ? data.orientation.oz : 0;
          orientation.w = data.orientation ? data.orientation.ow : 1;

          console.log(data.orientation);

          positionElement.textContent = `x=${rawX.toFixed(3)} y=${rawY.toFixed(
            3
          )} z=${rawZ.toFixed(3)}`;
          orientationElement.textContent = `ox=${orientation.x.toFixed(
            3
          )} oy=${orientation.y.toFixed(3)} oz=${orientation.z.toFixed(
            3
          )} ow=${orientation.w.toFixed(3)}`;
          commentDiv.innerHTML = `ox=${orientation.x.toFixed(
            3
          )} oy=${orientation.y.toFixed(3)} oz=${orientation.z.toFixed(
            3
          )} ow=${orientation.w.toFixed(3)}`;
          statusElement.textContent = "Connected";
          statusElement.style.color = "#00ff00";

          const distance = Math.sqrt(
            Math.pow(position.x - lastPosition.x, 2) +
              Math.pow(position.y - lastPosition.y, 2) +
              Math.pow(position.z - lastPosition.z, 2)
          );

          hasMovedSignificantly = distance > 0.1;

          if (hasMovedSignificantly) {
            trailPoints.push(
              new THREE.Vector3(position.x, position.y, position.z)
            );
            if (trailPoints.length > 200) {
              trailPoints.shift();
            }
            trailGeometry.setFromPoints(trailPoints);
            trailGeometry.attributes.position.needsUpdate = true;
          }

          updateTargetLine();
        } catch (error) {
          console.error("Error fetching current position:", error);
          statusElement.textContent = "Connection Error";
          statusElement.style.color = "#ff0000";
        }
      }

      // Fetch target position
      async function fetchTargetPosition() {
        try {
          const response = await fetch(`${domainUrl}/target_position`);
          if (!response.ok) {
            throw new Error(`HTTP error: ${response.status}`);
          }
          const data = await response.json();

          const rawX = data.x;
          const rawY = data.y;
          const rawZ = data.z;

          const transformed = transformCoordinates(rawX, rawY, rawZ);

          target.x = transformed.x;
          target.y = transformed.y;
          target.z = transformed.z;

          targetElement.textContent = `x=${rawX} y=${rawY} z=${rawZ}`;

          updateTargetLine();
        } catch (error) {
          console.error("Error fetching target position:", error);
        }
      }

      // Animation loop
      function animate() {
        requestAnimationFrame(animate);

        dot.position.x += (position.x - dot.position.x) * 0.1;
        dot.position.y += (position.y - dot.position.y) * 0.1;
        dot.position.z += (position.z - dot.position.z) * 0.1;

        const arrowPos = new THREE.Vector3(position.x, position.y, position.z);
        const offset = new THREE.Vector3(0, 0, -arrowLength);
        const quaternion = transformQuaternion(
          orientation.x,
          orientation.y,
          orientation.z,
          orientation.w
        );
        offset.applyQuaternion(quaternion);
        arrowPos.add(offset);

        arrowHelper.position.lerp(arrowPos, 0.1);
        arrowHelper.setDirection(
          new THREE.Vector3(0, 0, 1).applyQuaternion(quaternion)
        );

        targetDot.position.set(target.x, target.y, target.z);

        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
      }

      // Start animation
      animate();

      // Poll updates
      setInterval(fetchCurrentPosition, 1000);
      setInterval(fetchTargetPosition, 1000);

      // Initialize
      updateTargetLine();
      rotateAxes();
      rotateAxes();
    </script>
  </body>
</html>
